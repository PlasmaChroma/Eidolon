[package]
name = "fm1-rack-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "fm1_rack"
crate-type = ["staticlib", "rlib"]

[dependencies]
fm1-core = { path = "../vendor/fm1-emu/crates/fm1-core" }
fm1-soc = { path = "../vendor/fm1-emu/crates/fm1-soc" }

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"

